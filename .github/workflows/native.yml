# Build the Rust headless server and CLI for each platform.
#
# On every push and pull request that touches rust/, the crate's tests run on
# all three operating systems: the port was developed on Windows, and a path or
# locale assumption that only holds there would otherwise surface on a user's
# Mac.
#
# When a release is published, the binaries are attached to it. Setup on a
# machine without a Rust toolchain downloads the one for its platform
# (src/bun/native-binary.ts) and verifies it against the digest GitHub records,
# so asset names here are a contract with nativeAssetName() there.

name: native

on:
  push:
    branches: [main]
    paths: ["rust/**", "templates/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["rust/**", "templates/**", ".github/workflows/native.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach binaries to (e.g. V0.7.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x64, exe: ".exe", test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, platform: macos-arm64, exe: "", test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: macos-x64, exe: "", test: false }
          # 22.04, not latest: the binary links against the runner's glibc
          # (2.35 here), and one built on 24.04 needs 2.39 — which Debian 12
          # and Ubuntu 22.04 do not have.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, platform: linux-x64, exe: "", test: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A manual run attaches to inputs.tag, so it must build that tag's
          # sources, not whatever main has become since.
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Test
        if: matrix.test
        run: cargo test --manifest-path rust/Cargo.toml --target ${{ matrix.target }}

      - name: Build
        run: cargo build --release --manifest-path rust/Cargo.toml --target ${{ matrix.target }} --bin okf-mcp --bin okf

      - name: Name the binaries
        shell: bash
        run: |
          out="rust/target/${{ matrix.target }}/release"
          mkdir -p dist-native
          cp "$out/okf-mcp${{ matrix.exe }}" "dist-native/okf-mcp-${{ matrix.platform }}${{ matrix.exe }}"
          cp "$out/okf${{ matrix.exe }}" "dist-native/okf-${{ matrix.platform }}${{ matrix.exe }}"
          ls -l dist-native

      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: dist-native/*

      - name: Attach to the release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" dist-native/* --clobber --repo "$GITHUB_REPOSITORY"
